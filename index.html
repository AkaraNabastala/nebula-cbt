<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nebula CBT by AkaraNabastala. Platform ujian berbasis komputer."
    />
    <meta name="theme-color" content="#183B5B" />
    <title>Nebula CBT | AkaraNabastala</title>

    <script>
      (() => {
        try {
          const saved = localStorage.getItem("akara-theme");
          const preference = ["light", "dark", "system"].includes(saved)
            ? saved
            : "system";
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          const theme =
            preference === "system"
              ? systemDark
                ? "dark"
                : "light"
              : preference;

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
