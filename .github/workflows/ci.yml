name: CI

on:
  pull_request:
    branches: [main, feature/admin-user-management]
  push:
    branches: [main, feature/workspace-ux-restructure, feature/flexible-education-structure]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nebula_cbt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nebula_cbt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nebula_cbt
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check prisma/bootstrap-admin.mjs
      - run: node --check prisma/reset-admin-password.mjs
      - run: node --check prisma/seed.mjs
      - run: npx prisma generate --config prisma7.config.ts
      - run: npx prisma migrate deploy --config prisma7.config.ts
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
